server:
  port: 8081

spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1522/FREEPDB1}
    username: ${DB_USERNAME:eduandes}
    password: ${DB_PASSWORD:eduandes}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

logging:
  level:
    pe.edu.upeu.MatriculaBackend: INFO
